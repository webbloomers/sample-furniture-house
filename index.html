<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furniture House</title>
</head>
<body>
  <h1>Products</h1>
  <ul id="list"></ul>

  <script>
    fetch("data/products.json")
      .then((res) => res.json())
      .then((products) => {
        const list = document.getElementById("list");
        products.forEach((p) => {
          list.innerHTML += `
            <li>
              <img src="${p.images[0]}" width="200" alt="${p.name}">
              <p>${p.name}: ₹${p.price}</p>
            </li>`;
        });
      })
      .catch((err) => console.error("Could not load products:", err));
  </script>
</body>
</html>
