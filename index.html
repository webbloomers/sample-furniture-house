<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furniture House</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
   
  <body>
    <header class="navbar">
    <a href="index.html" class="logo">Furniture House</a>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">☰</button>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogue.html">Catalogue</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <h1>Products</h1>
  <ul id="list"></ul>
  <footer class="footer">
    <div class="footer-col">
      <h3>Furniture House</h3>
      <p>Handcrafted furniture for your home.</p>
    </div>
    <div class="footer-col">
      <h4>Links</h4>
      <a href="index.html">Home</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="footer-col">
      <h4>Contact</h4>
      <p>email@example.com</p>
      <p>+91 98765 43210</p>
    </div>
  </footer>
  

  <script src="js/data.js"></script>
<script>
  async function showProducts() {
    const list = document.getElementById("list");
    const products = await getAllProducts();

    products.forEach((p) => {
      list.innerHTML += `
        <li>
          <a href="product.html?slug=${p.slug}">
            <img src="${p.images[0]}" width="200" alt="${p.name}">
            <p>${p.name}: ${formatPrice(p.price)}</p>
          </a>
        </li>`;
    });
  }

  showProducts();
  </script>
</body>
<script>
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('open');
    });
  </script>
</html>
