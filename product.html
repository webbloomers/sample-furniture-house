<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product - Oakline Furnishing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
  <main>
    <div id="product-detail"></div>

    <section id="enquire" class="form-section">
      <h2>Enquire about this product</h2>

      <form id="enquiry-form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <p class="field-error" data-error-for="name"></p>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
        <p class="field-error" data-error-for="phone"></p>

        <label for="product">Product</label>
        <select id="product" name="product">
          <option value="">Select a product</option>
        </select>
        <p class="field-error" data-error-for="product"></p>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4"></textarea>
        <p class="field-error" data-error-for="message"></p>

        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
        <input type="hidden" name="_subject" value="New enquiry from Oakline Furnishing">

        <button type="submit" id="submit-btn">Send enquiry</button>
        <p id="form-status" role="status"></p>
      </form>

      <a id="whatsapp-btn" class="btn whatsapp-btn" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/product.js"></script>
   <script src="js/enquiry.js"></script>
  <script src="js/main.js"></script>
</html>
